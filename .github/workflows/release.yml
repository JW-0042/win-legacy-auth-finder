name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test LegacyAuthFinder.slnx -c Release
      - name: Publish self-contained single-file builds
        shell: pwsh
        run: |
          $common = @('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true','-p:EnableCompressionInSingleFile=true','-p:DebugType=none')
          dotnet publish src/LegacyAuthFinder.App @common -o publish/app
          dotnet publish src/LegacyAuthFinder.Cli @common -o publish/cli
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/app/LegacyAuthFinder.exe, publish/cli/legacy-auth-scan.exe, LICENSE, README.md -Destination dist
          Compress-Archive dist/* LegacyAuthFinder-win-x64.zip
          (Get-FileHash LegacyAuthFinder-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  LegacyAuthFinder-win-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            LegacyAuthFinder-win-x64.zip
            dist/*.exe
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} LegacyAuthFinder-win-x64.zip SHA256SUMS.txt --title "Legacy Auth Finder ${{ github.ref_name }}" --generate-notes
